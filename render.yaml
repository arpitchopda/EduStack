services:
  - type: web
    name: edustack
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: "file:./dev.db"
      - key: NEXTAUTH_URL
        sync: false # Set to your Render URL (e.g. https://edustack.onrender.com)
      - key: NEXTAUTH_SECRET
        generateValue: true
